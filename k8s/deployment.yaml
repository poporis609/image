apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-generator
  namespace: default
  labels:
    app: image-generator
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-generator
  template:
    metadata:
      labels:
        app: image-generator
        version: v1
    spec:
      serviceAccountName: library-service-account
      containers:
        - name: image-generator
          image: 324547056370.dkr.ecr.us-east-1.amazonaws.com/image-generator:4665e25e0678eab00e6ea76550df38d956a43983
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: USE_SECRETS_MANAGER
              value: "true"
            - name: DB_SECRET_NAME
              value: "journal-api/database"
            - name: AWS_REGION
              value: "us-east-1"
            - name: KNOWLEDGE_BASE_BUCKET
              value: "knowledge-base-test-6575574"
            - name: BEDROCK_FLOW_ID
              value: "E5J1KYPALJ"
            - name: BEDROCK_FLOW_ALIAS_ID
              value: "HZ5MQPO2A5"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
