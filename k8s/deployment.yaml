apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-generator
  namespace: default
  labels:
    app: image-generator
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-generator
  template:
    metadata:
      labels:
        app: image-generator
        version: v1
    spec:
      serviceAccountName: library-service-account
      containers:
        - name: image-generator
          image: ${ECR_REGISTRY}/image-generator:latest
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: USE_SECRETS_MANAGER
              value: "true"
            - name: DB_SECRET_NAME
              value: "journal-api/database"
            - name: AWS_REGION
              value: "us-east-1"
            - name: KNOWLEDGE_BASE_BUCKET
              value: "${KNOWLEDGE_BASE_BUCKET}"
            - name: BEDROCK_FLOW_ID
              value: "${BEDROCK_FLOW_ID}"
            - name: BEDROCK_FLOW_ALIAS_ID
              value: "${BEDROCK_FLOW_ALIAS_ID}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
