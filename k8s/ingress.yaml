apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-generator-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/group.name: one-api-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:324547056370:certificate/dcba4e4a-c0d5-4e97-aecc-91a1b35f7355
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    cors.ingress.kubernetes.io/allow-origin: "https://api.aws11.shop"
spec:
  ingressClassName: alb
  rules:
    - host: api.aws11.shop
      http:
        paths:
          - path: /image
            pathType: Prefix
            backend:
              service:
                name: image-generator-service
                port:
                  number: 3000
